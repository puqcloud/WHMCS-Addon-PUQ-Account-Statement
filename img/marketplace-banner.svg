<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c3ce0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Accent line top -->
  <rect x="0" y="0" width="500" height="8" fill="url(#accent)"/>

  <!-- Enlarged logo icon group (scaled & centered) -->
  <g transform="translate(145, 30) scale(1.35)">
    <!-- Document/statement icon -->
    <g transform="translate(10, 15)">
      <!-- Paper background -->
      <rect x="10" y="5" width="70" height="90" rx="4" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Fold corner -->
      <path d="M60,5 L80,5 L80,25 L60,25 Z" fill="#16213e" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M60,5 L60,25 L80,5 Z" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <!-- Header line -->
      <rect x="20" y="18" width="30" height="3" rx="1" fill="#6c3ce0" opacity="0.8"/>
      <!-- Table rows -->
      <line x1="20" y1="32" x2="70" y2="32" stroke="#4a5568" stroke-width="1.5"/>
      <line x1="20" y1="42" x2="70" y2="42" stroke="#4a5568" stroke-width="1.5"/>
      <line x1="20" y1="52" x2="70" y2="52" stroke="#4a5568" stroke-width="1.5"/>
      <line x1="20" y1="62" x2="70" y2="62" stroke="#4a5568" stroke-width="1.5"/>
      <line x1="20" y1="72" x2="70" y2="72" stroke="#4a5568" stroke-width="1.5"/>
      <!-- Column divider -->
      <line x1="50" y1="28" x2="50" y2="78" stroke="#4a5568" stroke-width="1"/>
      <!-- Dollar sign -->
      <text x="60" y="88" font-family="Arial, sans-serif" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="bold">$</text>
    </g>

    <!-- Chart/summary icon -->
    <g transform="translate(80, 55)">
      <rect x="0" y="20" width="10" height="25" rx="2" fill="#6c3ce0" opacity="0.6"/>
      <rect x="14" y="10" width="10" height="35" rx="2" fill="#8b5cf6" opacity="0.7"/>
      <rect x="28" y="0" width="10" height="45" rx="2" fill="#a78bfa" opacity="0.6"/>
      <rect x="42" y="15" width="10" height="30" rx="2" fill="#6c3ce0" opacity="0.5"/>
    </g>
  </g>

  <!-- Module Name (Big & Readable, Edge-to-Edge) -->
  <text x="250" y="265" font-family="Arial, sans-serif" font-size="68" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">ACCOUNT</text>
  <text x="250" y="335" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1.5">STATEMENT</text>

  <!-- Subtitle (Larger & Prominent) -->
  <text x="250" y="380" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">WHMCS ADDON</text>

  <!-- Separator -->
  <rect x="150" y="405" width="200" height="4" fill="#6c3ce0" rx="2"/>

  <!-- PUQ Software Branding (Enlarged & Centered) -->
  <g transform="translate(150, 435)">
    <text x="0" y="28" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6c3ce0">PUQ</text>
    <text x="92" y="28" font-family="Arial, sans-serif" font-size="22" fill="#64748b">Software</text>
  </g>
</svg>
